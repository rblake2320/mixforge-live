name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mixforge
          POSTGRES_PASSWORD: mixforge
          POSTGRES_DB: mixforge_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mixforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The Postgres and Redis integration suites run against these services;
      # without them they self-skip, so local runs without Docker still pass.
      MIXFORGE_TEST_DATABASE_URL: postgresql://mixforge:mixforge@127.0.0.1:55432/mixforge_test
      MIXFORGE_TEST_REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node --check src/app.js
      - run: node --check public/mixforge-backend.js
      - run: npm test
